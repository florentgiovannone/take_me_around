[build]
  command = "cd \"$(git rev-parse --show-toplevel)\" && npm ci && npm run build -w @tma/app-i-am-a-safe-pet"
  publish = "apps/i_am_a_safe_pet/dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/i_am_a_safe_pet packages"

# The scan dashboard is public (no password field). An edge function attaches
# X-Dashboard-Password for /api/secure/* so the browser never sees it.

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_DASHBOARD_PASSWORD,DASHBOARD_PASSWORD"

[[edge_functions]]
  function = "inject-dashboard-password"
  path = "/api/secure/*"
