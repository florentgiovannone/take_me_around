[build]
  command = "cd ../.. && npm ci && npm run build -w @tma/app-arkin-museum"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/arkin_museum packages"

# /dashboard redirects to https://arkin.takemearound.gallery/dashboard/museum (vite netlify-redirects plugin).

# Required for /dashboard API (Netlify UI → Environment variables → redeploy):
#   VITE_API_PROXY_TARGET = http://52.18.254.191:5050
#   (or https ngrok URL). Bakes /api/* proxy into dist/_redirects at build time.
# Do NOT set VITE_API_BASE_URL to the EC2 IP for production — browser blocks HTTP from HTTPS.
