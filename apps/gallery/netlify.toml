[build]
  command = "cd ../.. && npm ci && npm run build -w @tma/app-gallery"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/gallery packages"

# The password value is also the public CSS class prefix, so the scanner
# matches class names across the repo.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_DASHBOARD_PASSWORD,DASHBOARD_PASSWORD"

# /dashboard redirects to https://arkin.takemearound.gallery/dashboard
# /demodashboard and /demo redirect to https://arkin.takemearound.gallery/demodashboard
# (see vite netlify-redirects plugin).

# Build-time env (Site settings → Environment variables → Scopes: Builds only or All):
#   VITE_API_PROXY_TARGET = https://YOUR-SUBDOMAIN.ngrok-free.app   (recommended)
# Same URL works as VITE_API_BASE_URL if you prefer direct API calls (needs CORS on the API).
# After changing either variable, trigger Deploy → Clear cache and deploy site.
