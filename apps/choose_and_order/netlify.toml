[build]
  command = "cd \"$(git rev-parse --show-toplevel)\" && npm ci && npm run build -w @tma/app-choose-and-order"
  publish = "apps/choose_and_order/dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/choose_and_order packages"

# The dashboard is public (no password field). An edge function attaches
# X-Dashboard-Password for /api/secure/* so the browser never sees it.

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_DASHBOARD_PASSWORD,DASHBOARD_PASSWORD"

[[edge_functions]]
  function = "inject-dashboard-password"
  path = "/api/secure/*"
