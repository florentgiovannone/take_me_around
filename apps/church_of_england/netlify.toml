[build]
  command = "cd ../.. && npm ci && npm run build -w @tma/app-church-of-england"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/church_of_england packages"

# /dashboard redirects to https://arkin.takemearound.gallery/dashboard/church-of-england
# (vite netlify-redirects plugin).

# Required for production deploys (set in Netlify UI, then redeploy):
#   VITE_API_PROXY_TARGET = https://YOUR-NGROK-OR-API-HOST.ngrok-free.app
# Optional alias (same effect at build time):
#   VITE_API_BASE_URL = same URL
