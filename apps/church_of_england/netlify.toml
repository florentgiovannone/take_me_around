[build]
  # Netlify runs this site with repo root as cwd (Package directory =
  # apps/church_of_england). Install from the monorepo root; publish the
  # Vite outDir under the app. If you instead set Base directory to
  # apps/church_of_england, change publish back to "dist".
  command = "cd \"$(git rev-parse --show-toplevel)\" && npm ci && npm run build -w @tma/app-church-of-england"
  publish = "apps/church_of_england/dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/church_of_england packages"

# /dashboard is a public in-app analytics view (no password). An edge function
# attaches X-Dashboard-Password for /api/secure/* so the browser never sees it.
# Vite also writes dist/_redirects with /api/* proxy + /* → /index.html.

[[edge_functions]]
  function = "inject-dashboard-password"
  path = "/api/secure/*"

# Required for production deploys (set in Netlify UI, then redeploy):
#   VITE_API_PROXY_TARGET = https://YOUR-NGROK-OR-API-HOST.ngrok-free.app
# Optional alias (same effect at build time):
#   VITE_API_BASE_URL = same URL
# Required for the passwordless church dashboard (server-side only):
#   VITE_DASHBOARD_PASSWORD or DASHBOARD_PASSWORD = backend DASHBOARD_PASSWORD
